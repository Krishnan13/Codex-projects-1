name: Deploy app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        run: npm run build

      - name: Install rsvg-convert
        run: sudo apt-get install -y librsvg2-bin

      - name: Generate PNG icons
        run: |
          mkdir -p app/dist/icons
          rsvg-convert -w 512 -h 512 app/public/favicon.svg -o app/dist/icons/icon-512.png
          rsvg-convert -w 192 -h 192 app/public/favicon.svg -o app/dist/icons/icon-192.png
          rsvg-convert -w 180 -h 180 app/public/favicon.svg -o app/dist/icons/apple-touch-icon.png

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
